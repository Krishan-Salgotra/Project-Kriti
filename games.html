<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Our Little Games ❤️</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&family=Great+Vibes&display=swap" rel="stylesheet">

<link rel="stylesheet" href="css/variables.css">
<link rel="stylesheet" href="css/style.css">
<link rel="stylesheet" href="css/components.css">
<link rel="stylesheet" href="css/game.css">

</head>

<body>

<!-- Background -->

<div class="background">

    <div id="stars"></div>

    <div class="gradient"></div>

    <div class="moon"></div>

</div>

<!-- Game -->

<section class="game-section">

    <div class="chapter">

        <span class="chapter-number">

            Chapter 4

        </span>

        <h1>

            🎮 Our Little Games

        </h1>

        <p>

    Every falling heart is another reason I love you.

</p>

    </div>

    <div class="score-box">

    <h3>❤️ Filling My Heart...</h3>

<p>

    Counting every reason
    I adore you ❤️

</p>

    <div class="progress">

        <div id="progressBar"></div>

    </div>

    <div class="score">

        <span id="score">0</span>

        /

        <span id="targetScore">15</span>

    </div>

</div>

<!-- Hearts -->
<div id="heartContainer"></div>

</section>

<script src="js/stars.js"></script>
<script src="js/music.js"></script>
<script src="js/transition.js"></script>
<script src="js/game.js"></script>

</body>

</html>
