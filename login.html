<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Login • Project Kriti</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&family=Great+Vibes&display=swap" rel="stylesheet">

    <link rel="stylesheet" href="css/variables.css">
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/components.css">
    <link rel="stylesheet" href="css/animations.css">

<body class="login-body">

<div class="background">

<div class="stars"></div>

<div class="gradient"></div>

<div class="moon"></div>

</div>

<section class="login-page">

<div class="login-card" id="loginCard">

<h1 class="love-title">

Project <span>Kriti</span>

</h1>

<p class="date">

02 • 07 • 2026

</p>

<p class="subtitle">

Every beautiful story begins with one unforgettable date.

</p>

<p class="subtitle2">

Enter the date our journey began.

</p>

<div class="password-box">

<input
type="password"
id="password"
placeholder="DDMMYY">

</div>

<button id="unlockButton">

Unlock My Heart ❤️

</button>

<p id="message"></p>

</div>

</section>

<script src="js/music.js"></script>
<script src="js/transition.js"></script>
<script src="js/login.js"></script>

</body>
