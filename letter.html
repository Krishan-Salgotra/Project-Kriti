<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>A Letter For You ❤️</title>

    <!-- Google Fonts -->

    <link rel="preconnect" href="https://fonts.googleapis.com">

    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<link href="https://fonts.googleapis.com/css2?family=Great+Vibes&family=Alex+Brush&family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">    <!-- CSS -->

    <link rel="stylesheet" href="css/variables.css">
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/components.css">
    <link rel="stylesheet" href="css/letter.css">
    <link rel="stylesheet" href="css/animations.css">
    <link rel="stylesheet" href="css/responsive.css">

</head>

<body>

    <!-- Background -->

    <div class="background">

        <div id="stars" class="stars"></div>

        <div class="gradient"></div>

        <div class="moon"></div>

        <div class="aurora"></div>

        <div class="cloud cloud1"></div>

        <div class="cloud cloud2"></div>

    </div>

    <!-- Main -->

    <section class="letter-section">

        <!-- Chapter -->

        <div class="letter-header">

            <span class="chapter-number">
                Chapter 4
            </span>

            <h1 class="letter-title">
                💌 A Letter From My Heart
            </h1>

            <p class="letter-subtitle">
                Some words are too special to be spoken...
                <br>
                so I wrote them instead.
            </p>

        </div>

        <!-- Envelope -->

        <div class="envelope-wrapper">

            <div class="envelope" id="envelope">

                <div class="envelope-top"></div>

                <div class="envelope-body"></div>

                <div class="letter-paper">

                    <h2>For Kriti ❤️</h2>

                    <p>
                        Click to open...
                    </p>

                </div>

            </div>

        </div>

        <!-- Letter -->

        <div class="letter-container" id="letterContainer">

            <div class="letter">

                <p class="greeting">
                    Dear Kriti,
                </p>

                <div id="letterText"></div>

                <p class="signature">

                    Forever Yours,

                    <br><br>

                    Krish ❤️

                </p>

            </div>

        </div>

        <!-- Continue -->

        <div class="continue-box" id="continueBox">

            <a href="#"
   class="continue-btn"
   onclick="event.preventDefault(); goToPage('games.html');">

                Continue Our Story ❤️

            </a>

        </div>

    </section>

    <!-- JS -->

    <script src="js/stars.js"></script>
    <script src="js/shootingStars.js"></script>
    <script src="js/hearts.js"></script>
    <script src="js/music.js"></script>
    <script src="js/transition.js"></script>
    <script src="js/letter.js"></script>

</body>

</html>
