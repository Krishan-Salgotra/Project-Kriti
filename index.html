<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Project Kriti ❤️</title>

    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&family=Great+Vibes&display=swap" rel="stylesheet">

    <!-- CSS -->
    <link rel="stylesheet" href="css/variables.css">
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/animations.css">
    <link rel="stylesheet" href="css/responsive.css">
    <link rel="stylesheet" href="css/premium-bg.css">

</head>

<body>

    <!-- Background -->
    <div class="background">

        <div class="stars"></div>
        <div class="gradient"></div>

    </div>

    <!-- Loader -->
    <section class="loader">

        <div class="loader-box">

            <h2 class="logo">
                Project
                <span>Kriti</span>
            </h2>

            <p id="loadingText">
                Initializing...
            </p>

            <div class="progress-container">

                <div class="progress-bar" id="progressBar"></div>

            </div>

            <p class="loading-percent" id="loadingPercent">
                0%
            </p>

        </div>

    </section>

    <!-- JS -->
    <script src="js/transition.js"></script>
<script src="js/loader.js"></script>
<script src="js/premium-bg.js"></script>

</body>

</html>
